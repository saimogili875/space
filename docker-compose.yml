version: "3.8"

services:
  backend:
    build: ./backend
    container_name: mangalens-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/models_trained:/app/models_trained
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: mangalens-ui
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
